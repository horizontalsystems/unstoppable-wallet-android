# Guards BIP39 -> BIP84 address derivation: the wallet restored from
# MNEMONIC must show exactly EXPECTED_ADDRESS (independently derived,
# verified against the BIP84 spec test vector). The phrase must stay
# unused on-chain: any transaction on it shifts the first unused
# address and breaks this test. Never send funds to it.
appId: io.horizontalsystems.bankwallet.dev
env:
  MNEMONIC: "token weekend gadget save flush gaze ready debris input finish evidence diet"
  EXPECTED_ADDRESS: "bc1qndm0dw0clq4ucr3gnrvpjdculf9xqje3g53gc7"
---
- launchApp:
    clearState: true
- runFlow: ../subflows/restore_wallet_from_phrase.yaml

# Open the BTC receive screen from the token screen
- tapOn: "BTC"
- tapOn:
    text: "Receive"
    index: 0

# The exact first address and format must be shown
- assertVisible: ${EXPECTED_ADDRESS}
- assertVisible: "Format: Native SegWit (BIP 84)"

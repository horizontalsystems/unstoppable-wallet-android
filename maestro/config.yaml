# Feature and on-chain tests. The journey runs on its own from journey/,
# because its steps depend on each other's order.
flows:
  - features/*/*
  - onchain/**
excludeTags:
  - quarantine
executionOrder:
  # The balance check runs first so a low dust balance shows as such, not as
  # send failures. The flows after it run either way.
  continueOnFailure: true
  flowsOrder:
    - "On-chain · dust wallet balance"

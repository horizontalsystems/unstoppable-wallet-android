# App Status renders, and a base currency change reaches the balance screen.
appId: ${APP_ID || 'io.horizontalsystems.bankwallet.fdroidci.e2e'}
tags: [journey]
---
- tapOn:
    id: tab_settings
- scrollUntilVisible:
    element:
      id: settings_about
- tapOn:
    id: settings_about
- tapOn:
    id: about_app_status
# Building the screen assembles every status section up front (the crash
# this guards against happened there), so reaching the always-present
# App Info block proves the whole screen rendered.
- assertVisible: "App Info"
- assertVisible: "App Version"
- back
- back

- scrollUntilVisible:
    element:
      id: settings_app_settings
    direction: UP
- tapOn:
    id: settings_app_settings
- tapOn:
    id: appearance_base_currency
- tapOn:
    id: currency_EUR
# Choosing a currency closes the pages above Settings
- runFlow:
    when:
      notVisible:
        id: tab_balance
    commands:
      - back
- tapOn:
    id: tab_balance
- assertVisible:
    text: "€0"
    childOf:
      id: balance_total

# Backs up the wallet created in step 02: reveals the generated 12-word
# phrase, answers the verification quiz with the right words, and checks the
# wallet is no longer flagged as backup-required.
appId: ${APP_ID || 'io.horizontalsystems.bankwallet.fdroidci.e2e'}
tags: [journey]
---
- tapOn:
    id: tab_settings
- tapOn:
    id: settings_manage_wallets

# Open the manual backup
- tapOn:
    id: account_options_0
- tapOn:
    id: account_manual_backup

# Reveal the generated phrase
- tapOn:
    id: backup_reveal
- assertNotVisible: "Tap to show recovery phrase"

# Read the 12 words, numbered from 1 as on screen
- evalScript: ${output.words = []}
- copyTextFrom:
    id: backup_word_1
- evalScript: ${output.words[1] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_2
- evalScript: ${output.words[2] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_3
- evalScript: ${output.words[3] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_4
- evalScript: ${output.words[4] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_5
- evalScript: ${output.words[5] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_6
- evalScript: ${output.words[6] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_7
- evalScript: ${output.words[7] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_8
- evalScript: ${output.words[8] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_9
- evalScript: ${output.words[9] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_10
- evalScript: ${output.words[10] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_11
- evalScript: ${output.words[11] = maestro.copiedText}
- copyTextFrom:
    id: backup_word_12
- evalScript: ${output.words[12] = maestro.copiedText}

# Answer the verification quiz with the words at the requested positions
- tapOn:
    id: backup_verify
- copyTextFrom:
    id: quiz_position_0
- evalScript: ${output.q1 = parseInt(maestro.copiedText)}
- copyTextFrom:
    id: quiz_position_1
- evalScript: ${output.q2 = parseInt(maestro.copiedText)}
- tapOn:
    id: quiz_option_${output.words[output.q1]}
- tapOn:
    id: quiz_option_${output.words[output.q2]}

# Quiz passed: the wallet must no longer require backup
- tapOn: "Back"
- assertVisible:
    text: "12 words"
    childOf:
      id: account_row_0
- assertNotVisible: "Backup Required"
- back

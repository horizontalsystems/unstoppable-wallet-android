# Restores the public test wallet. The address checks in the next step
# expect its first addresses to be unused: never send funds to it.
appId: ${APP_ID || 'io.horizontalsystems.bankwallet.appcenter.e2e'}
tags: [journey]
---
- runFlow:
    file: ../subflows/wallet/restore_from_phrase.yaml
    env:
      MNEMONIC: "token weekend gadget save flush gaze ready debris input finish evidence diet"
      CHAINS: "bitcoin,ethereum"
- assertVisible:
    id: balance_item_BTC
- assertVisible:
    id: balance_item_ETH

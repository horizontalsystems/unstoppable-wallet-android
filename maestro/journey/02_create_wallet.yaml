appId: ${APP_ID || 'io.horizontalsystems.bankwallet.appcenter.e2e'}
tags: [journey]
---
- tapOn:
    id: tab_balance
- runFlow: ../subflows/wallet/create_standard_wallet.yaml

# Balance screen of an empty wallet
- assertVisible:
    id: balance_receive
- assertVisible:
    id: balance_send
- assertVisible:
    text: "$0"
    childOf:
      id: balance_total

# A new wallet is flagged as not backed up
- tapOn:
    id: tab_settings
- tapOn:
    id: settings_manage_wallets
- assertVisible:
    text: "Backup Required"
    childOf:
      id: account_row_0
- back

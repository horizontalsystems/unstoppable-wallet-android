# Guards address derivation for the wallet restored in step 08: BIP84 for
# Bitcoin and m/44'/60'/0'/0/0 for Ethereum. Both addresses were derived
# independently and checked against the spec test vectors.
appId: ${APP_ID || 'io.horizontalsystems.bankwallet.appcenter.e2e'}
tags: [journey]
env:
  BTC_ADDRESS: "bc1qndm0dw0clq4ucr3gnrvpjdculf9xqje3g53gc7"
  ETH_ADDRESS: "0x60A40e0483b2eE741A60C3079a06C8A68F3712ee"
---
- tapOn:
    id: balance_item_BTC
- tapOn:
    id: token_receive
- assertVisible:
    id: receive_address
    text: ${BTC_ADDRESS}
- assertVisible:
    id: receive_format
    text: "Format: Native SegWit (BIP 84)"
- back
- back

- tapOn:
    id: balance_item_ETH
- tapOn:
    id: token_receive
- assertVisible:
    id: receive_address
    text: ${ETH_ADDRESS}
- assertVisible:
    id: receive_network
    text: "Network: Ethereum"
- back
- back

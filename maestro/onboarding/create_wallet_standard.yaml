appId: ${APP_ID || 'io.horizontalsystems.bankwallet.dev'}
---
# Fresh install: create a new standard wallet
- launchApp:
    clearState: true
- runFlow: ../subflows/create_standard_wallet.yaml

# Wallet is created: balance screen with wallet actions
- assertVisible: "Receive"
- assertVisible: "Send"
- assertVisible: "$0"

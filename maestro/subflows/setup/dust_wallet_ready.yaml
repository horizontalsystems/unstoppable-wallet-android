# The starting point of the send tests: clears the app, passes the intro and
# restores the team dust wallet with the chains in ${CHAINS}. The phrase comes
# from MAESTRO_E2E_DUST_MNEMONIC in the environment, never from the repo (see
# maestro/README.md, "Secrets"). Waits until ${COIN} has synced.
appId: ${APP_ID || 'io.horizontalsystems.bankwallet.fdroidci.e2e'}
---
- assertTrue:
    condition: ${typeof MAESTRO_E2E_DUST_MNEMONIC !== 'undefined' && MAESTRO_E2E_DUST_MNEMONIC.split(' ').length >= 12}
    label: "MAESTRO_E2E_DUST_MNEMONIC is not set"
- launchApp:
    clearState: true
- runFlow: ../onboarding/pass_intro.yaml
- runFlow:
    file: ../wallet/restore_from_phrase.yaml
    env:
      MNEMONIC: ${MAESTRO_E2E_DUST_MNEMONIC}
      CHAINS: ${CHAINS}
- runFlow:
    file: ../wallet/wait_for_sync.yaml
    env:
      COIN: ${COIN}

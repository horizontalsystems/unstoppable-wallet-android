# Turns on ${CHAIN} in the restore chain list. For chains with a single token,
# which enable without a settings sheet.
appId: ${APP_ID || 'io.horizontalsystems.bankwallet.appcenter.e2e'}
---
- scrollUntilVisible:
    element:
      id: restore_chain_${CHAIN}
    timeout: 10000
    optional: true
# Already scrolled past it
- runFlow:
    when:
      notVisible:
        id: restore_chain_${CHAIN}
    commands:
      - scrollUntilVisible:
          element:
            id: restore_chain_${CHAIN}
          direction: UP
- tapOn:
    id: restore_chain_${CHAIN}

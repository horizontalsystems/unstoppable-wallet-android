# Creates a new standard wallet with the suggested name.
# Starts from the intro of a freshly launched app, ends on the balance screen.
appId: ${APP_ID || 'io.horizontalsystems.bankwallet.dev'}
---
- runFlow: pass_intro.yaml
- tapOn:
    id: onboarding_new_wallet
- runFlow: accept_terms.yaml
- tapOn:
    id: create_type_standard
- tapOn:
    id: create_submit

# Restores a Bitcoin + Ethereum wallet from ${MNEMONIC} (callers must define it).
# Starts from the intro of a freshly launched app, ends on the balance screen.
appId: ${APP_ID || 'io.horizontalsystems.bankwallet.dev'}
---
- runFlow: pass_intro.yaml
- tapOn:
    id: onboarding_existing_wallet
- runFlow: accept_terms.yaml
- tapOn:
    id: import_recovery_phrase
- tapOn:
    id: restore_phrase_input
- inputText: ${MNEMONIC}
- hideKeyboard
- tapOn:
    id: restore_next
# Bitcoin opens the derivation sheet; its defaults are kept
- tapOn:
    id: restore_chain_bitcoin
- tapOn:
    id: selector_done
- tapOn:
    id: restore_chain_ethereum
- tapOn:
    id: restore_submit

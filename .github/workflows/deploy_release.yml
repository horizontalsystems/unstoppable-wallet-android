name: Deploy Release to Firebase

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      build_number: ${{ steps.build_number.outputs.value }}
      commit_subject: ${{ steps.notes.outputs.subject }}
      ci_testing_uri: ${{ steps.upload_ci.outputs.TESTING_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Build Number
        id: build_number
        env:
          APPCENTER_NUMBER: 147
        run: |
          NUMBER=$(($APPCENTER_NUMBER+$GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER_NEW=$NUMBER" >> $GITHUB_ENV
          echo "value=$NUMBER" >> $GITHUB_OUTPUT

      - name: Get Release Notes
        id: notes
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%an')
          MESSAGE=$(git log -1 --pretty=format:'%s')
          echo "val=Author: $AUTHOR, changes: $MESSAGE" >> $GITHUB_OUTPUT
          # Escaped for the HTML-formatted Telegram notification
          echo "subject=$(printf '%s' "$MESSAGE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build CI Release
        run: ./gradlew clean assembleCiRelease --stacktrace --no-daemon
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER_NEW }}

      - name: Upload CI Release to Firebase
        id: upload_ci
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:308085819273:android:d1451c165f07056ea00358
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: horsysteam
          file: app/build/outputs/apk/ci/release/app-ci-release.apk
          releaseNotes: ${{ steps.notes.outputs.val }}

  # Runs in a separate job so the third-party action never shares a workspace
  # with the checked-out repo credentials
  notify:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Notify Telegram on success
        if: needs.build.result == 'success'
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ✅ Master Build (${{ needs.build.outputs.build_number }})

            Title: ${{ needs.build.outputs.commit_subject }}
            Author: @${{ github.actor }}

            <a href="${{ needs.build.outputs.ci_testing_uri }}">Open release</a>

      - name: Notify Telegram on failure
        if: needs.build.result == 'failure'
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ❌ Master Build (${{ needs.build.outputs.build_number }}) failed

            Title: ${{ needs.build.outputs.commit_subject }}
            Author: @${{ github.actor }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Log</a>

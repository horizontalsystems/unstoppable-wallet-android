name: Deploy Dev to Firebase

on:
  push:
    branches: [ version/* ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build_number: ${{ steps.build_number.outputs.value }}
      details: ${{ steps.notes.outputs.details }}
      ci_testing_uri: ${{ steps.upload_ci.outputs.TESTING_URI }}
      fdroid_testing_uri: ${{ steps.upload_fdroid.outputs.TESTING_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Build Number
        id: build_number
        env:
          APPCENTER_NUMBER: 1210
        run: |
          NUMBER=$(($APPCENTER_NUMBER+$GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER_NEW=$NUMBER" >> $GITHUB_ENV
          echo "value=$NUMBER" >> $GITHUB_OUTPUT

      - name: Get Release Notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%an')
          MESSAGE=$(git log -1 --pretty=format:'%s')
          echo "val=Author: $AUTHOR, changes: $MESSAGE" >> $GITHUB_OUTPUT

          # The pull request this commit arrived with, and the issue it references
          PULLS="$RUNNER_TEMP/pulls.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > "$PULLS" || echo '[]' > "$PULLS"
          PR=$(jq -r '.[0].number // empty' "$PULLS")
          PR_BODY=$(jq -r '.[0].body // ""' "$PULLS")
          ISSUE=$(printf '%s\n%s\n' "$PR_BODY" "$MESSAGE" \
            | grep -oiE '(closes?d?|fix(es|ed)?|resolves?d?|part of|relates? to) #[0-9]+' \
            | head -1 | grep -oE '[0-9]+' || true)

          # Escaped for the HTML-formatted Telegram notification
          SUBJECT=$(printf '%s' "$MESSAGE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          PR_LINK="—"
          ISSUE_LINK="—"
          if [ -n "$PR" ]; then PR_LINK="<a href=\"$REPO_URL/pull/$PR\">#$PR</a>"; fi
          if [ -n "$ISSUE" ]; then ISSUE_LINK="<a href=\"$REPO_URL/issues/$ISSUE\">#$ISSUE</a>"; fi
          {
            echo "details<<TELEGRAM_EOF"
            echo "Title: $SUBJECT"
            echo "PR: $PR_LINK"
            echo "Issue: $ISSUE_LINK"
            echo "Author: $GITHUB_ACTOR"
            echo "TELEGRAM_EOF"
          } >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build CI Debug
        run: ./gradlew clean assembleCiDebug --stacktrace --no-daemon
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER_NEW }}

      - name: Upload CI Debug to Firebase
        id: upload_ci
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:308085819273:android:1b039e927925b879a00358
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: horsysteam
          file: app/build/outputs/apk/ci/debug/app-ci-debug.apk
          releaseNotes: ${{ steps.notes.outputs.val }}

      - name: Build F-Droid CI Debug
        run: ./gradlew clean assembleFdroidCiDebug --stacktrace --no-daemon
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER_NEW }}

      - name: Upload F-Droid CI Debug to Firebase
        id: upload_fdroid
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:308085819273:android:3c060bb15aa35d79a00358
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: horsysteam
          file: app/build/outputs/apk/fdroidCi/debug/app-fdroidCi-debug.apk
          releaseNotes: "F-Droid Build - ${{ steps.notes.outputs.val }}"

  # Runs in a separate job so the third-party action never shares a workspace
  # with the checked-out repo credentials
  notify:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Notify Telegram on success
        if: needs.build.result == 'success'
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ✅ Version Build (${{ needs.build.outputs.build_number }})

            ${{ needs.build.outputs.details }}

            <a href="${{ needs.build.outputs.ci_testing_uri }}">Standard</a> | <a href="${{ needs.build.outputs.fdroid_testing_uri }}">F-Droid</a>

      - name: Notify Telegram on failure
        if: needs.build.result == 'failure'
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ❌ Version Build (${{ needs.build.outputs.build_number }}) failed

            ${{ needs.build.outputs.details }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Log</a>

name: Maestro UI Tests

# Pushes and pull requests to develop run the feature tests. The nightly
# run tests develop and adds the journey and the on-chain tests, which use
# the dust wallet phrase. Telegram gets every nightly result and every failed
# push to develop. See maestro/README.md.
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    # 19:00 UTC, 01:00 in Bishkek. Runs from the default branch's copy of
    # this file, which then checks out develop
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Run as the nightly: journey, on-chain tests and a Telegram report'
        type: boolean
        default: false
      ref:
        description: 'Branch to test as the nightly (default: develop)'
        default: ''
      tags:
        description: 'Tags of the tests to run when not nightly; journey adds the journey'
        default: 'feature'

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      branch: ${{ steps.plan.outputs.branch }}
      nightly: ${{ steps.plan.outputs.nightly }}
      tags: ${{ steps.plan.outputs.tags }}
      parts: ${{ steps.plan.outputs.parts }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Pick the branch and the tests
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_NIGHTLY: ${{ inputs.nightly }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAGS: ${{ inputs.tags }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$INPUT_NIGHTLY" = "true" ]; then
            branch="${INPUT_REF:-develop}"
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
            tags="feature,history,onchain"
            journey=true
          else
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            tags="${INPUT_TAGS:-feature}"
            case ",$tags," in *,journey,*) journey=true ;; *) journey=false ;; esac
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          # The flows take longer than the journey, so two jobs share them
          parts="flows-1 flows-2"
          matrix='{"name":"flows-1","part":"flows","shard":"1/2"},{"name":"flows-2","part":"flows","shard":"2/2"}'
          if [ "$journey" = "true" ]; then
            parts="journey $parts"
            matrix='{"name":"journey","part":"journey"},'"$matrix"
          fi
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "matrix=[$matrix]" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Record the tested commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build the e2e APK
        run: ./gradlew :app:assembleCiE2e --stacktrace --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: e2e-apk
          path: app/build/outputs/apk/ci/e2e/app-ci-e2e.apk
          retention-days: 3

  test:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: test (${{ matrix.name }})
    env:
      # Only the nightly runs the on-chain tests; other runs never see the phrase
      MAESTRO_E2E_DUST_MNEMONIC: ${{ needs.plan.outputs.nightly == 'true' && secrets.MAESTRO_E2E_DUST_MNEMONIC || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Download the APK
        uses: actions/download-artifact@v8
        with:
          name: e2e-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | MAESTRO_VERSION=2.11.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The emulator boots cold in about 35 s; a saved snapshot failed to
      # load on these runners, so only the system image download is cached
      - name: Cache the emulator system image
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: system-image-35-google_apis-x86_64-v1

      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: SHARD=${{ matrix.shard }} maestro/scripts/ci-run.sh ${{ matrix.part }} apk/app-ci-e2e.apk maestro-results ${{ needs.plan.outputs.tags }}

      # Maestro writes typed text to its logs; this removes the dust wallet
      # phrase and the on-chain screenshots, and fails if the phrase is left
      - name: Redact results
        id: redact
        if: always()
        run: maestro/scripts/collect-artifacts.sh maestro-results

      - name: Upload results
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-${{ matrix.name }}
          path: maestro-results
          retention-days: 14

  report:
    needs: [plan, build, test]
    env:
      # The matrix names of the test jobs
      PARTS: ${{ needs.plan.outputs.parts }}
    # Nightly results, and failed pushes to develop
    if: >-
      always() && (needs.plan.outputs.nightly == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      (needs.build.result == 'failure' || needs.test.result == 'failure')))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: maestro/scripts

      - name: Download results
        uses: actions/download-artifact@v8
        # A job that stopped early uploads nothing; the report says so
        continue-on-error: true
        with:
          pattern: maestro-*
          path: results

      - name: Rename result folders
        run: |
          mkdir -p results
          for part in $PARTS; do
            if [ -d "results/maestro-$part" ]; then mv "results/maestro-$part" "results/$part"; fi
          done

      - name: Send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.MAESTRO_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          SHA: ${{ needs.build.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ needs.plan.outputs.nightly == 'true' && 'nightly' || github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" = "failure" ]; then
            for part in $PARTS; do
              mkdir -p "results/$part"
              echo "the e2e APK did not build" > "results/$part/setup-error.txt"
            done
          fi
          maestro/scripts/notify-telegram.sh results "$TRIGGER"

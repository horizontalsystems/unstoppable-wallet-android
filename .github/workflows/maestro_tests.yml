name: Maestro UI Tests

on:
  push:
    branches:
      - 'version/**'
      # Temporary: runs the workflow from the feature branch before it merges
      - maestro-test-plan
  pull_request:
    branches:
      - 'version/**'
  schedule:
    # 19:00 UTC, 01:00 in Bishkek
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags of the feature and on-chain tests (journey always runs)'
        default: 'feature,history'

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build the e2e APK
        run: ./gradlew :app:assembleCiE2e --stacktrace --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apk
          path: app/build/outputs/apk/ci/e2e/app-ci-e2e.apk
          retention-days: 3

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [journey, flows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: e2e-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | MAESTRO_VERSION=2.11.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: maestro/scripts/ci-run.sh ${{ matrix.part }} apk/app-ci-e2e.apk maestro-results ${{ inputs.tags || 'feature,history' }}

      # Maestro writes typed text to its logs; this removes the dust wallet
      # phrase and the on-chain screenshots before anything is uploaded
      - name: Redact results
        if: always()
        run: maestro/scripts/collect-artifacts.sh maestro-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ matrix.part }}
          path: maestro-results
          retention-days: 14

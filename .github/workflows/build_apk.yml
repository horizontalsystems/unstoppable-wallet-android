name: Build APK

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Protection rules for this environment are set in the repository settings
    environment: release
    permissions:
      contents: write
    container:
      image: hsdao/android-release-build:java-17-update

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Base Release
        run: ./gradlew :app:assembleBaseRelease

      - name: Build F-Droid Release
        run: ./gradlew :app:assembleFdroidRelease

      - name: Sign Base APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          apksigner sign --ks keystore.jks --ks-pass env:KS_PASS \
            app/build/outputs/apk/base/release/app-base-release-unsigned.apk

      - name: Sign F-Droid APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          apksigner sign --ks keystore.jks --ks-pass env:KS_PASS \
            app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk

      # The tag goes through an environment variable, never straight into the
      # script, so a crafted tag name cannot run shell commands
      - name: Rename APKs
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Unexpected tag: $TAG"; exit 1; }
          cp app/build/outputs/apk/base/release/app-base-release-unsigned.apk "unstoppable_wallet_google_play_${TAG}.apk"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk "unstoppable_wallet_github_${TAG}.apk"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: true
          files: |
            unstoppable_wallet_google_play_*.apk
            unstoppable_wallet_github_*.apk

  # Runs in a separate job so the third-party action never shares a workspace
  # with the decoded keystore or the checked-out repo credentials
  notify:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Notify Telegram on success
        if: needs.build.result == 'success'
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: |
            ✅ Release build succeeded
            Tag: ${{ github.ref_name }}
            Author: @${{ github.actor }}
            ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      - name: Notify Telegram on failure
        if: needs.build.result == 'failure'
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: |
            ❌ Release build failed
            Tag: ${{ github.ref_name }}
            Author: @${{ github.actor }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

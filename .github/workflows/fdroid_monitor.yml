name: F-Droid Release Monitor

# Follows the newest version tag through F-Droid (fdroiddata, build cycle,
# publishing) and posts to Telegram each time it moves to a new stage. The
# last reported stage travels between runs as the fdroid-monitor-state
# artifact, which the workflow token can read and write, so scheduled runs
# only report changes.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fdroid-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      state: ${{ steps.monitor.outputs.state }}
      changed: ${{ steps.monitor.outputs.changed }}
      message: ${{ steps.monitor.outputs.message }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts/fdroid_monitor.py
          sparse-checkout-cone-mode: false

      - name: Restore last reported stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh api "repos/$GH_REPO/actions/artifacts?name=fdroid-monitor-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name fdroid-monitor-state --dir state
          fi

      - name: Check F-Droid status
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_STATE="$(cat state/state.json 2>/dev/null || true)" \
            python3 -I .github/scripts/fdroid_monitor.py

  notify:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Notify Telegram
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: ${{ needs.check.outputs.message }}

  # Runs on every check so the artifact never expires while the schedule is
  # alive, but after a change only once the notification went out, so a
  # failed send is retried on the next run instead of being lost
  save:
    needs: [check, notify]
    if: always() && needs.check.result == 'success' && (needs.check.outputs.changed != 'true' || needs.notify.result == 'success')
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Write stage file
        env:
          STATE: ${{ needs.check.outputs.state }}
        run: |
          mkdir state
          printf '%s\n' "$STATE" > state/state.json

      - name: Save reported stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fdroid-monitor-state
          path: state/state.json
          retention-days: 90
